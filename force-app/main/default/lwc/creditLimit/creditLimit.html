<template>
    <lightning-card title="Credit Limit">
       
            <lightning-icon size="small" class="pointer" onclick={refreshCallMethodWorthiness} icon-name="utility:refresh" slot="actions" alternative-text="refresh"></lightning-icon>
        
        <template if:true={accountRecord}>
            <template if:true={disableButton}>
                <span slot="actions" class="smallMarginLeft statusWarning"> <lightning-icon class="slds-current-color" icon-name="utility:warning" size="small" alternative-text="Warning" title="Warning"></lightning-icon></span>
            </template>    
        </template>
        
        <div class="alignCenter">
    
            <template if:true ={accountRecord}>
        
                <div class="alignCenter">
                    
                    <lightning-button label={accountCredtiLimitLabel} aria-label="test" title="test" disabled={disableButton} onclick={getAccountCreditLimit} ></lightning-button>
                    <template if:true={disableButton}>
                        <lightning-helptext class="smallMarginLeft" icon-name="utility:info_alt" content={buttonTitle}></lightning-helptext>
                    </template>
                </div>

                <template if:true={showAccountLimit}>
                <p data-id="messageText" class="alignCenter smallPaddingTop"> {label.limitAccountMessage} <lightning-formatted-number value={accountLimit} format-style="currency" currency-code={objectCurrency} minimum-fraction-digits="2"></lightning-formatted-number></p>
                </template>
                <template if:true={showError}>
                    <div>
                        <p data-id="errorText" class="alignCenter smallPaddingTop"> <span class="errorStatus"> <lightning-icon class="slds-current-color" display={showError} icon-name="utility:error" size="small" alternative-text="Error" title="Error"></lightning-icon></span> {errorMessage}</p>
                    </div>
                
                </template>
            </template>
            
            <template if:true ={quoteRecord}>
                  <template if:true ={isLoading}>
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </template>
               
                <template if:false ={isLoading}>
            
                    <table class="smallPadding">

                        <tr>
                            <template if:true={quoteLimitSuccess}>
                            <td class="smallPadding">
                                <span class="smallMarginLeft"> <span class="statusSuccess smallMarginRight"> <lightning-icon class="slds-current-color" display={quoteLimitSuccess} icon-name="utility:success" size="small" alternative-text="Success" title="Success"></lightning-icon></span>{quoteLimitMessage}</span>
                            </td>
                            </template>
                            <template if:true={quoteLimitError}> 
                                
                            <td class="smallPadding">
                                <span class="smallMarginLeft"> <span class="errorStatus smallMarginRight"> <lightning-icon class="slds-current-color" display={quoteLimitError} icon-name="utility:error" size="small" alternative-text="Error" title="Error"></lightning-icon></span>{quoteLimitMessage}</span>
                            </td>
                            
                            </template>
                            
                        </tr>
                        <tr>
                            
                        </tr>
                    </table>
                </template>
            </template>

<template if:true ={orderRecord}>
                <template if:true ={isLoading}>
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </template>
                    <table class="smallPadding">
                    
                        <tr>
                            <template if:true={orderLimitSuccess}>
                            <td class="smallPadding">
                                <span class="smallMarginLeft"> <span class="smallMarginRight statusSuccess"> <lightning-icon class="slds-current-color" display={orderLimitSuccess} icon-name="utility:success" size="small" alternative-text="Success" title="Success"></lightning-icon></span>{orderLimitMessage}</span>
                            </td>
                            </template>
                            <template if:true={orderLimitError}>    
                            <td class="smallPadding">
                                <span class="smallMarginLeft"> <span class="errorStatus smallMarginRight"> <lightning-icon class="slds-current-color" display={orderLimitError} icon-name="utility:error" size="small" alternative-text="Error" title="Error"></lightning-icon></span>{orderLimitMessage}</span>
                            </td>
                            
                            </template>
                           
                        </tr>
                        
                    </table>
               
            </template>
        </div>
    </lightning-card>
    
</template>
