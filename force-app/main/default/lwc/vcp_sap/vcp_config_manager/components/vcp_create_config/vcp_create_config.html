<template>
  <div class="vcp-create-config">
    <!-- Form Section -->
    <div class="slds-form">
      <lightning-input
        type="text"
        label="Knowledge Base ID"
        value={kbId}
        placeholder="e.g., 10000"
        onchange={handleKbIdChange}
        required
      ></lightning-input>

      <lightning-input
        type="text"
        label="Product Key"
        value={productKey}
        placeholder="e.g., F00K001001"
        onchange={handleProductKeyChange}
        required
      ></lightning-input>

      <lightning-combobox
        label="Mode"
        value={mode}
        options={modeOptions}
        onchange={handleModeChange}
      ></lightning-combobox>

      <lightning-input
        type="date"
        label="Date"
        value={date}
        onchange={handleDateChange}
      ></lightning-input>

      <lightning-checkbox-group
        label="Options"
        options={optionsList}
        onchange={handleAutoCleanupChange}
      ></lightning-checkbox-group>
    </div>

    <!-- Button -->
    <div class="slds-m-top_medium">
      <button
        class="slds-button slds-button_brand"
        onclick={handleCreateConfig}
        disabled={isLoading}
      >
        <template if:false={isLoading}>
          Create Configuration
        </template>
        <template if:true={isLoading}>
          <lightning-spinner size="small"></lightning-spinner>
          Creating...
        </template>
      </button>
    </div>

    <!-- Error Display -->
    <template if:true={error}>
      <div class="slds-notify slds-notify_alert slds-alert_error slds-m-top_medium">
        <span>{{ error }}</span>
      </div>
    </template>

    <!-- JSON Preview -->
    <template if:true={requestJson}>
      <div class="slds-m-top_large">
        <h3 class="slds-text-title">Request</h3>
        <pre><code>{{ JSON.stringify(requestJson, null, 2) }}</code></pre>
      </div>
    </template>

    <template if:true={responseJson}>
      <div class="slds-m-top_large">
        <h3 class="slds-text-title">Response</h3>
        <pre><code>{{ JSON.stringify(responseJson, null, 2) }}</code></pre>
      </div>
    </template>
  </div>
</template>
