<template>
  <div class="vcp-config-manager">
    <!-- Global Error Display -->
    <template if:true={error}>
      <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
        <span class="slds-assistive-text">Error</span>
        <button
          class="slds-button slds-button_icon slds-alert__close"
          title="Close"
          onclick={clearError}
        >
          <lightning-icon
            icon-name="utility:close"
            alternative-text="Close error"
            size="small"
          ></lightning-icon>
        </button>
        <span class="slds-p-horizontal_small">{{ error }}</span>
      </div>
    </template>

    <!-- Configuration Storage Section (only when not in Step 2) -->
    <template if:true={configStorageVisible}>
      <section class="vcp-section">
        <h2 class="slds-m-bottom_medium">Configuration Storage</h2>
        <c-vcp-config-storage
          quote-id={quoteId}
          onloaded={handleConfigLoaded}
          onerror={handleError}
        ></c-vcp-config-storage>
      </section>
    </template>

    <!-- Step 1: Create Configuration -->
    <template if:true={step1Visible}>
      <section class="vcp-section">
        <h2 class="slds-m-bottom_medium">
          <span>Step 1: Create Configuration</span>
          <span class="slds-badge">New Request</span>
        </h2>
        <c-vcp-create-config
          quote-id={quoteId}
          oncomplete={handleStep1Complete}
          onerror={handleError}
        ></c-vcp-create-config>
      </section>
    </template>

    <!-- Step 2: Configure Product -->
    <template if:true={step2Visible}>
      <section class="vcp-section">
        <h2 class="slds-m-bottom_medium">
          <span>Step 2: Configure Product</span>
          <span class="slds-badge">Runtime</span>
        </h2>
        <c-vcp-configure-product
          onreset={handleStep2Reset}
          onerror={handleError}
        ></c-vcp-configure-product>
      </section>
    </template>

    <!-- Activity Log (always visible) -->
    <section class="vcp-section vcp-section_log">
      <h2 class="slds-m-bottom_medium">Activity Log</h2>
      <c-vcp-activity-log></c-vcp-activity-log>
    </section>
  </div>
</template>
