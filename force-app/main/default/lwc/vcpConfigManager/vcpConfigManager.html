<template>
    <lightning-card title="Add Product" icon-name="standard:product">
        <template if:true={showBack}>
            <lightning-button
                slot="actions"
                label="Back"
                icon-name="utility:back"
                icon-position="left"
                variant="neutral"
                onclick={handleBack}
            ></lightning-button>
        </template>
        <template if:true={isBusy}>
            <lightning-spinner size="medium" alternative-text="Loading"></lightning-spinner>
        </template>

        <div class="panel">
            <div class="context-row">
                <span class="context-pill">Source: {launchSource}</span>
                <span class="context-pill">Quote: {effectiveQuoteNumber}</span>
                <span class="context-pill">QuoteId: {effectiveQuoteId}</span>
                <span class="context-pill">Product: {effectiveProductCode}</span>
            </div>

            <template if:true={showSetupSections}>
                <section class="section">
                    <h3 class="section-title">Configuration Management</h3>
                    <lightning-input
                        type="text"
                        label="Stored Config ID"
                        value={storedConfigId}
                        onchange={handleStoredConfigChange}
                    ></lightning-input>

                    <div class="button-grid">
                        <lightning-button label="Load Stored" onclick={handleLoadStored}></lightning-button>
                        <lightning-button label="Simulate Loading" onclick={handleSimulateLoading}></lightning-button>
                        <lightning-button label="Restart & Create New" onclick={handleRestartCreate}></lightning-button>
                        <lightning-button label="Remove" onclick={handleRemoveStored}></lightning-button>
                    </div>
                    <p class="helper-text">
                        Load: existing config | Simulate: creates if needed and loads | Restart: force new config | Remove: clear from Salesforce
                    </p>
                </section>

                <section class="section">
                    <button class="accordion-btn" onclick={toggleStep1}>
                        Step 1: Create Configuration
                    </button>

                    <div class={step1SectionClass}>
                        <div class="grid-3">
                            <div>
                                <lightning-input type="text" label="KB ID" value={kbId} onchange={handleKbIdChange}></lightning-input>
                                <p class="helper-text">-3 = auto from product key</p>
                            </div>
                            <div class="date-field">
                                <lightning-input type="date" label="Date (optional)" value={selectedDate} onchange={handleDateChange}></lightning-input>
                                <template if:true={selectedDate}>
                                    <button class="clear-btn" onclick={handleClearDate} title="Clear date">×</button>
                                </template>
                            </div>
                            <lightning-input type="checkbox" label="Auto cleanup (2h TTL)" checked={autoCleanup} onchange={handleAutoCleanupChange}></lightning-input>
                        </div>

                        <div class="grid-2">
                            <lightning-combobox label="Product Key Source" value={productKeyMode} options={productKeyModeOptions} onchange={handleProductKeyModeChange}></lightning-combobox>
                            <lightning-input type="text" label="Product Key (sent to SAP)" value={productKey} readonly={productKeyReadonly} onchange={handleProductKeyChange} placeholder="Will be filled from selection"></lightning-input>
                        </div>

                        <div class="json-box">
                            <p class="json-title">Request Preview</p>
                            <pre>{requestPreview}</pre>
                        </div>

                        <lightning-button variant="brand" label="Create Configuration" onclick={handleCreateConfiguration}></lightning-button>
                    </div>
                </section>
            </template>

            <template if:true={runtimeVisible}>
                <section class="section">
                    <div class="config-context-banner">
                        <div class="banner-left">
                            <div class="config-context-title">Product Configuration</div>
                            <div class="config-context-product">{headerProductLabel}</div>
                            <div class="config-context-subtitle">
                                <template if:true={loadedKbName}>
                                    <span class="config-context-pill">KB Name: {loadedKbName}</span>
                                </template>
                                <template if:true={loadedKbVersion}>
                                    <span class="config-context-pill">Version: {loadedKbVersion}</span>
                                </template>
                                <template if:true={loadedKbLogsys}>
                                    <span class="config-context-pill">System: {loadedKbLogsys}</span>
                                </template>
                                <template if:true={loadedKbId}>
                                    <span class="config-context-pill">KB ID: {loadedKbId}</span>
                                </template>
                            </div>
                        </div>
                        <div class="banner-right">
                            <div class="banner-controls">
                                <div class="lang-group">
                                    <span class="lang-label">Language</span>
                                    <button class={apiModeClass} onclick={handleLabelModeApi}>🤖 API</button>
                                    <button class={enModeClass} onclick={handleLabelModeEn}><img src={usFlagUrl} alt="EN" class="flag-icon"/> English</button>
                                    <button class={esModeClass} onclick={handleLabelModeEs}><img src={esFlagUrl} alt="ES" class="flag-icon"/> Spanish</button>
                                    <button class={deModeClass} onclick={handleLabelModeDe}><img src={deFlagUrl} alt="DE" class="flag-icon"/> Deutsch</button>
                                </div>
                                <div class="display-mode-group">
                                    <span class="lang-label">View</span>
                                    <button class={formModeClass} onclick={handleDisplayModeForm}>📋 Form</button>
                                    <button class={wizardModeClass} onclick={handleDisplayModeWizard}>🧙 Wizard</button>
                                    <button class={tabsModeClass} onclick={handleDisplayModeTabs}>🗂 Tabs</button>
                                </div>
                                <button class={debugToggleClass} onclick={handleDebugModeToggle} title="Toggle debug mode">🔧 Debug</button>
                            </div>
                        </div>
                    </div>

                    <template if:true={debugMode}>
                        <div class="grid-3">
                            <lightning-combobox label="Field Visibility" value={visibilityMode} options={visibilityOptions} onchange={handleVisibilityChange}></lightning-combobox>
                            <lightning-input type="text" label="ETag (editable)" value={eTag} placeholder='W/"n"' onchange={handleETagChange}></lightning-input>
                            <lightning-combobox label="ETag Version Preset" value={eTagVersionStr} options={eTagVersionOptions} onchange={handleETagVersionChange}></lightning-combobox>
                        </div>
                        <div class="debug-stats-row">
                            <span class="debug-stat-pill">Total: {totalCharacteristicCount}</span>
                            <span class="debug-stat-pill">Visible: {visibleCharacteristicCount}</span>
                            <span class="debug-stat-pill">Hidden: {hiddenCharacteristicCount}</span>
                            <span class="debug-stat-pill">Readonly: {readonlyCharacteristicCount}</span>
                            <span class="debug-stat-pill">Pending: {pendingCharacteristicCount}</span>
                        </div>
                    </template>

                    <template if:true={isFormMode}>
                        <c-vcp-characteristics-form
                            characteristics={loadedCharacteristics}
                            visibility-mode={visibilityMode}
                            label-mode={labelMode}
                            oncharacteristicchange={handleCharacteristicChange}
                        ></c-vcp-characteristics-form>
                    </template>
                    <template if:true={isWizardMode}>
                        <c-vcp-characteristics-wizard
                            characteristics={loadedCharacteristics}
                            visibility-mode={visibilityMode}
                            label-mode={labelMode}
                            oncharacteristicchange={handleCharacteristicChange}
                            onwizardfinish={handleWizardFinish}
                        ></c-vcp-characteristics-wizard>
                    </template>
                    <template if:true={isTabsMode}>
                        <div class="tabs-layout">
                            <aside class="product-tree-panel">
                                <div class="product-tree-title">Configurable Items</div>
                                <template if:true={hasProductsTree}>
                                    <div class="product-tree-list">
                                        <template for:each={productListForTemplate} for:item="product">
                                            <button
                                                key={product.id}
                                                class={product.buttonClass}
                                                data-depth={product.depth}
                                                data-product-id={product.id}
                                                onclick={handleProductSelection}
                                            >
                                                <span class="product-node-main">
                                                    {product.label}
                                                    <template if:true={product.isRoot}>
                                                        <span class="product-root-badge">ROOT</span>
                                                    </template>
                                                </span>
                                            </button>
                                        </template>
                                    </div>
                                </template>
                                <template if:false={hasProductsTree}>
                                    <p class="helper-text">No products available yet.</p>
                                </template>
                            </aside>

                            <section class="tabs-content-panel">
                                <div class="tabs-content-header">
                                    <div class="tabs-content-title">{selectedProductName}</div>
                                    <template if:true={selectedProductCode}>
                                        <div class="tabs-content-subtitle">Code: {selectedProductCode}</div>
                                    </template>
                                </div>

                                <template if:false={selectedProductIsConfigurable}>
                                    <p class="helper-text">This product is not configurable. Characteristics are shown as readonly.</p>
                                </template>

                                <template if:true={selectedProductHasCharacteristics}>
                                    <c-vcp-characteristics-group-tabs
                                        groups={characteristicsByGroup}
                                        visibility-mode={visibilityMode}
                                        label-mode={labelMode}
                                        oncharacteristicchange={handleCharacteristicChange}
                                    ></c-vcp-characteristics-group-tabs>
                                </template>
                                <template if:false={selectedProductHasCharacteristics}>
                                    <p class="helper-text">This product has no characteristics to configure.</p>
                                </template>
                            </section>
                        </div>
                    </template>

                    <div class="form-footer">
                        <lightning-button
                            label={autoPatchToggleLabel}
                            variant={autoPatchToggleVariant}
                            icon-name="utility:settings"
                            onclick={handleToggleAutoPatch}
                            title="Toggle automatic characteristic PATCH on change"
                        ></lightning-button>
                        <template if:true={showSendPendingButton}>
                            <lightning-button
                                label={sendPendingLabel}
                                variant="brand-outline"
                                icon-name="utility:upload"
                                onclick={handleSendPendingPatches}
                                disabled={isSendPendingDisabled}
                                title="Send all queued characteristic changes in one PATCH"
                            ></lightning-button>
                        </template>
                        <lightning-button
                            label="Discard &amp; Reload"
                            icon-name="utility:refresh"
                            onclick={handleResetConfigurationInSap}
                            title="Reset configuration to initial state and reload from SAP VC"
                        ></lightning-button>
                        <lightning-button
                            label="Reset Config"
                            icon-name="utility:back"
                            onclick={handleStep2Reset}
                        ></lightning-button>
                    </div>

                    <template if:true={debugMode}>
                        <details class="json-collapsible">
                            <summary class="json-collapsible-summary">API JSON View (PATCH Preview + Last Response)</summary>
                            <div class="debug-panels-grid debug-panels-grid-collapsible">
                                <div class="json-box json-box-collapsible">
                                    <p class="json-title">PATCH Preview</p>
                                    <pre>{patchPreviewText}</pre>
                                </div>
                                <div class="json-box json-box-collapsible">
                                    <p class="json-title">Last Response</p>
                                    <pre>{createResponse}</pre>
                                </div>
                            </div>
                        </details>
                    </template>
                </section>
            </template>

            <template if:true={showActivityLog}>
                <section class="section activity-log">
                    <h3 class="section-title">Activity Log</h3>
                    <c-util-activity-log entries={activityLogForTemplate}></c-util-activity-log>
                </section>
            </template>
        </div>
    </lightning-card>
</template>
