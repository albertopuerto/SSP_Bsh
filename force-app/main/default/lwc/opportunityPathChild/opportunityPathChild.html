<template>

    <div class="slds-path__content" id="path-coaching-2">
        <div class="slds-path__coach slds-grid">
            <div class="slds-path__keys">
                <div class="slds-grid slds-grid_align-spread slds-path__coach-title">
                    <h2 style="margin-left:10px;">Key Fields </h2>
                    <button class="slds-button slds-path__coach-edit slds-text-body_small"
                        onclick={enableEdition}>Edit</button>
                </div>
                <div class="slds-form" role="list">

                    <div style="padding:10px;">
                        <lightning-record-form object-api-name='Opportunity' fields={fieldList} record-id={oppid}
                            onsubmit={handleSubmit} mode="view" onsuccess={handleSuccess}>

                        </lightning-record-form>
                    </div>
                </div>
            </div>
            <div class="slds-path__guidance">
                <c-record-path-child-guidance guidance={guidance}></c-record-path-child-guidance>
            </div>
        </div>
    </div>

    <template if:true={isModeEdition}>
        <section role="dialog" tabindex="-1" aria-labelledby="" aria-modal="true" aria-describedby="modal-content-id-1"
            class="slds-modal slds-fade-in-open">
            <div style="width:1000px;" class="slds-modal__container">

                <header class="slds-modal__header" style="border-top-left-radius: 20px; border-top-right-radius: 20px;">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalDelete}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h1 id="" class="slds-text-heading_medium slds-hyphenate">Edit Opportunity</h1>
                </header>

                <div class="slds-modal__content slds-p-around_medium" id="modal-staffingCreationContent">
                    <lightning-record-form object-api-name='Opportunity' fields={fieldList} record-id={oppid} onsubmit={handleSubmit} mode="edit" onsuccess={handleSuccess}>

                    </lightning-record-form>
                </div>

                <footer class="slds-modal__footer"
                    style="border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;">
                    <lightning-button label="Close" title="Cancel" onclick={hideModalStaffingCreation} class="slds-m-left_x-small"></lightning-button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>



    </template>
</template>
