<template>

        <div class="slds-p-around_medium">
            <template if:true={showSpinner}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>

            <template if:true={showError}>
                <div style="background-color: #ea001e;padding: 15px;color:white;">
                    <p>
                        <span>
                            <lightning-icon icon-name="utility:error" alternative-text="error" size="x-small" class="slds-button__icon slds-button__icon_left" variant="inverse"></lightning-icon>
                        </span> Error
                    </p>
                    <p style="margin-top: 10px;">The quote has one or more subscription or Software products. With this products a Tool Coordinator must be added, please review and add the tool coordinator.</p>
                </div>
            </template>

            <template if:true={showExceeded}>
                <div>
                    <p>
                        Credit limit = {currency} {accountLimit}
                    </p>
                    <p style="margin-top:10px;">
                        VAT = {currency} {vat} <lightning-icon style="margin-left:280px;" icon-name='utility:warning' alternative-text='warning' variant='warning' size='medium' title='warning'></lightning-icon>
                    </p>
                    <p style="margin-top:10px;">
                        Quote Net Amount = {currency} {quoteAmount} 
                    </p>
                    <p style="margin-top:10px;">Credit limit is not enough, Send for Approval anyways</p>
                </div>
                <div style="margin-top:10px;margin-left:140px;">
                    <lightning-button variant="brand" label=Submit aria-label="Submit" title="Submit" onclick={getAccountCreditLimit} ></lightning-button>
                    
                </div>
            </template>
        </div>
  
</template>
