<template>

    <lightning-card  title="Credit Limit check for Approval">

        <div class="slds-p-around_medium">
            <template if:true={showSpinner}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>

            <template if:true={showError}>
                <div style="background-color: #ea001e;padding: 15px;color:white;">
                    <p>
                        <span>
                            <lightning-icon icon-name="utility:error" alternative-text="error" size="x-small" class="slds-button__icon slds-button__icon_left" variant="inverse"></lightning-icon>
                        </span> Error
                    </p>
                    <p style="margin-top: 10px;">The quote has one or more subscription or Software products. With this products a Tool Coordinator must be added, please review and add the tool coordinator.</p>
                </div>
            </template>

            <template if:true={showExceeded}>
                <div>
                    <p> Credit limit of {accountName} is currently below Quote Amount (incl. VAT):</p>
                    <table style="margin-top:10px;">
                        <tr>
                            <td>
                                <p>Credit limit :</p>
                            </td>
                            <td>
                                <p><lightning-formatted-number value={accountLimit} format-style="currency" currency-code={currency} currency-display-as="code"></lightning-formatted-number></p>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <p>Quote Amount incl. {vat}% VAT for {accountCountry}:</p>
                            </td>
                            <td>
                                <p><lightning-formatted-number value={quoteAmount} format-style="currency" currency-code={currency} currency-display-as="code"></lightning-formatted-number> </p>
                            </td>
                            <td>
                                <lightning-icon style="margin-left:80px;" icon-name='utility:warning' alternative-text='warning' variant='warning' size='medium' title='warning'></lightning-icon>
                            </td>
                        </tr>
                    </table>
            
                    <p style="margin-top:10px;">Do you want to Submit Quote for Approval anyway?</p>
                </div>
                <div style="margin-top:10px;margin-left:370px;">
                    <lightning-button variant="brand" label=Submit aria-label="Submit" title="Submit" onclick={submitApproval} ></lightning-button>
                    <lightning-button variant="destructive" label="Cancel" title="Cancel" onclick={closeModal} class="slds-m-left_x-small"></lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
