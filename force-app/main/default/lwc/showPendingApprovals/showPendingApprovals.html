<template>
    <lightning-card title="My Pending Approvals">
        <template if:true={approvals}>
            <lightning-datatable
                key-field="Id"
                data={approvals}
                columns={columns}
                hide-checkbox-column="true">
            </lightning-datatable>
        </template>
        <template if:true={error}>
            <p class="slds-text-color_error">Error loading approvals: {error.message}</p>
        </template>
    </lightning-card>
</template>
